name: False positive on a stock device
description: A non-jailbroken device is reported as jailbroken, suspicious or compromised.
labels: [false-positive, detection]
body:
  - type: input
    id: device
    attributes: { label: Device and iOS version }
    validations: { required: true }
  - type: dropdown
    id: install
    attributes:
      label: How was Kaisel installed?
      options: [Xcode, Signed IPA, Impactor, Sideloadly, AltStore, TestFlight / App Store (your own app)]
    validations: { required: true }
  - type: textarea
    id: json
    attributes:
      label: Result JSON (redacted)
      description: Use "Copy result JSON" in the app. Remove anything that identifies a person or organisation.
      render: json
    validations: { required: true }
  - type: checkboxes
    id: stock
    attributes:
      label: Confirmation
      options:
        - label: The device has never been jailbroken, or was restored with a full IPSW since.
          required: true
